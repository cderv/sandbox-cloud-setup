name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in *.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning *.sh
      - name: python syntax
        run: python3 -m py_compile secret-guard.py cloud-doctor.py
      - name: secret-guard tests
        run: python3 test_secret_guard.py
      - name: setup.sh in a scratch HOME
        env:
          CLOUD_SETUP_BRAID: "0.8.1"
        run: |
          HOME="$(mktemp -d)" bash setup.sh
          # hooks registered once, even when re-run
          HOME="$RUNNER_TEMP/h" bash -c 'bash setup.sh >/dev/null && bash setup.sh >/dev/null && python3 -c "import json,os; h=json.load(open(os.path.expanduser(\"~/.claude/settings.json\")))[\"hooks\"]; assert all(len(v)==1 for v in h.values()), h; print(\"hooks ok\")"'
      - name: session-start.sh (healthy start, then self-repair of a missing tool)
        env:
          CLOUD_SETUP_BRAID: "0.8.1"
          CLOUD_SETUP_REPO: ${{ github.workspace }}
          CLOUD_SETUP_REF: ${{ github.sha }}
          BRAID_SYNC_URL: wss://example.invalid
        run: |
          export HOME="$RUNNER_TEMP/h" PATH="$RUNNER_TEMP/h/.local/bin:$PATH"
          out="$(bash session-start.sh)"; echo "$out"; [[ "$out" == "cloud-setup: up to date"* ]]
          rm "$HOME/.local/bin/braid"
          out="$(bash session-start.sh)"; echo "$out"; [[ "$out" == "cloud-setup: up to date"* ]]
          unset BRAID_SYNC_URL
          bash session-start.sh | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'BRAID_SYNC_URL' in d['systemMessage'], d; print('warning ok')"
      - name: setup.sh with CLOUD_SETUP_BRAID=latest (resolved to the newest tag)
        env:
          CLOUD_SETUP_BRAID: latest
        run: |
          export HOME="$RUNNER_TEMP/bl"
          bash setup.sh
          want="$(git ls-remote --tags --refs https://github.com/cscheid/braid | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          "$HOME/.local/bin/braid" --version | grep -F "$want"
          grep -qx 'braid=latest' "$HOME/.config/cloud-setup/state"
      - name: bootstrap options block (agent-browser, no braid), then a variable turning it off
        env:
          CLOUD_SETUP_REPO: ${{ github.workspace }}
          CLOUD_SETUP_REF: ${{ github.sha }}
        run: |
          export HOME="$RUNNER_TEMP/ab" PATH="$RUNNER_TEMP/ab/.local/bin:$PATH"
          mkdir -p "$HOME/.config/cloud-setup"
          # what bootstrap.sh writes with CLOUD_SETUP_AGENT_BROWSER="latest" in its options block
          printf 'CLOUD_SETUP_BRAID=\nCLOUD_SETUP_QUARTO=\nCLOUD_SETUP_AGENT_BROWSER=latest\nCLOUD_SETUP_ATTRIBUTION=keep\nCLOUD_SETUP_SECRET_VARS=MY_API_KEY\n' > "$HOME/.config/cloud-setup/defaults"
          bash setup.sh
          agent-browser --version
          test -f "$HOME/.claude/skills/agent-browser/SKILL.md"
          python3 -c "import json,os; c=json.load(open(os.path.expanduser('~/.agent-browser/config.json'))); assert os.access(c['executablePath'], os.X_OK), c; print('browser', c['executablePath'])"
          python3 -c "import json,os; assert 'attribution' not in json.load(open(os.path.expanduser('~/.claude/settings.json'))); print('attribution kept')"
          # braid off: no braid installed, no BRAID_SYNC_URL warning
          test ! -e "$HOME/.local/bin/braid"
          out="$(bash session-start.sh)"; echo "$out"; [[ "$out" == "cloud-setup: up to date"*"agent-browser"* ]]
          out="$(CLOUD_SETUP_AGENT_BROWSER=off bash session-start.sh)"; echo "$out"; [[ "$out" != *"agent-browser"* ]]
          grep -qx 'agent_browser=' "$HOME/.config/cloud-setup/state"
          python3 cloud-doctor.py
  opt-in-r:
    # rig add installs a .deb with apt: needs root, like the claude.ai setup script.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh with CLOUD_SETUP_R=release (then idempotent re-run)
        run: |
          h="$RUNNER_TEMP/r"
          sudo env HOME="$h" CLOUD_SETUP_R=release bash setup.sh | tee "$RUNNER_TEMP/1.log"
          grep -q '^R installed: [0-9]' "$RUNNER_TEMP/1.log"
          /usr/local/bin/R --version | head -1
          sudo grep -qx 'r=release' "$h/.config/cloud-setup/state"
          sudo env HOME="$h" CLOUD_SETUP_R=release bash setup.sh | tee "$RUNNER_TEMP/2.log"
          grep -q '^R already installed: ' "$RUNNER_TEMP/2.log"
          /usr/local/bin/Rscript -e 'stopifnot(grepl("packagemanager.posit.co", getOption("repos")[["P3M"]]))'
  opt-in-uv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh with CLOUD_SETUP_UV=latest, CLOUD_SETUP_PYTHON (then idempotent re-run)
        env:
          CLOUD_SETUP_UV: latest
          CLOUD_SETUP_PYTHON: "3.12 3.14"
        run: |
          export HOME="$RUNNER_TEMP/u"
          bash setup.sh 2>&1 | tee "$RUNNER_TEMP/1.log"
          grep -q '^uv installed: [0-9]' "$RUNNER_TEMP/1.log"
          "$HOME/.local/bin/uv" --version
          "$HOME/.local/bin/python3.12" --version
          "$HOME/.local/bin/python3.14" --version
          # never --default: no python/python3 shadowing the system one
          [ ! -e "$HOME/.local/bin/python3" ] && [ ! -e "$HOME/.local/bin/python" ]
          grep -qx 'python=3.12 3.14' "$HOME/.config/cloud-setup/state"
          bash setup.sh 2>&1 | tee "$RUNNER_TEMP/2.log"
          grep -q '^uv already installed: ' "$RUNNER_TEMP/2.log"
  opt-in-just:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: setup.sh with CLOUD_SETUP_JUST=latest (then idempotent re-run)
        env:
          CLOUD_SETUP_JUST: latest
        run: |
          export HOME="$RUNNER_TEMP/j"
          bash setup.sh 2>&1 | tee "$RUNNER_TEMP/1.log"
          grep -q '^just installed: [0-9]' "$RUNNER_TEMP/1.log"
          "$HOME/.local/bin/just" --version
          grep -qx 'just=latest' "$HOME/.config/cloud-setup/state"
          test -f "$HOME/.claude/skills/just/SKILL.md"
          # a project justfile -> its recipes in Claude's context
          mkdir -p "$RUNNER_TEMP/proj" && printf 'build:\n  echo b\n\ntest: build\n  echo t\n\n_hidden:\n  echo h\n' > "$RUNNER_TEMP/proj/justfile"
          out="$(CLAUDE_PROJECT_DIR="$RUNNER_TEMP/proj" CLOUD_SETUP_REPO="$GITHUB_WORKSPACE" CLOUD_SETUP_REF="$GITHUB_SHA" bash session-start.sh)"; echo "$out"
          [[ "$out" == *"justfile: recipes build test - prefer"* ]]
          bash setup.sh 2>&1 | tee "$RUNNER_TEMP/2.log"
          grep -q '^just already installed: ' "$RUNNER_TEMP/2.log"
          ! grep -q 'just: skill installed' "$RUNNER_TEMP/2.log"
